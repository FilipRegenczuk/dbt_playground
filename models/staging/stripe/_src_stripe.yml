sources:
  - name: stripe
    database: raw
    schema: stripe
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: _batched_at
    tables:
      - name: payment
        columns:
          - name: id
            data_tests:
              - unique:
                  config:
                    severity: error
                    error_if: ">100"
                    warn_if: ">10"
              - not_null
          - name: orderid
            data_tests:
              - not_null
          - name: amount
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
          - name: paymentmethod
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['bank_transfer', 'coupon', 'credit_card', 'gift_card']
                  config:
                    where: "status = 'success'"
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['success', 'fail']
                  config:
                    limit: 10